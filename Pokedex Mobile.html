  trainerHeightIn: 68,    // default trainer height: 5'8"
};
let settings = { ...SETTINGS_DEFAULTS };

function applySettings() {
  // Sprite size
  const sprite = document.getElementById('mainSprite');
  if (sprite) { sprite.style.width = settings.spriteSize + 'px'; sprite.style.height = settings.spriteSize + 'px'; }

  // Font scale on the content area
  const contentScreen = document.getElementById('contentScreen');
  if (contentScreen) contentScreen.style.fontSize = settings.fontSize + 'em';

  // Re-render info tab if active so height unit updates
  if (currentTab === 'info' && currentPokemon) renderInfo();
}

// ── HEIGHT COMPARISON MODAL ──
// entries: array of { kind:'trainer' } | { kind:'pokemon', id, name, sprite, baseHeightM, scaleSupported, scale, isCurrent }
let heightCompare = { entries: [], includeTrainer: true };

function formatFeetInches(totalInches) {
  totalInches = Math.round(totalInches);
  const feet = Math.floor(totalInches / 12);
  const inches = totalInches % 12;
  return `${feet}'${inches}"`;
}

// Shared height formatter so the INFO card and the modal always agree
function formatHeight(heightM) {
  if (settings.heightUnit === 'imperial') {
    const totalInches = heightM / 0.0254;
    return formatFeetInches(totalInches);
  }
  return `${heightM.toFixed(2)} m`;
}

function getBestArtwork(poke) {
  return poke.sprites?.other?.['official-artwork']?.front_default
    || poke.sprites?.front_default
    || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${poke.id}.png`;
}

// Approximate model of the Scarlet/Violet individual "scale" stat (1-255).
// 128 ≈ average size (1.0×); 1 ≈ smallest (~0.5×); 255 ≈ largest (~1.5×).
// This is a fan approximation for visualization purposes, not exact game data.
const SCALE_DEFAULT = 128;
function scaleMultiplier(scaleVal) {
  return 0.5 + scaleVal / 256;
}

function makePokemonEntry(poke, isCurrent) {
  return {
    kind: 'pokemon',
    uid: 'p' + poke.id + (isCurrent ? '-cur' : '-' + Math.random().toString(36).slice(2,7)),
    id: poke.id,
    name: poke.name.replace(/-/g,' '),
    sprite: getBestArtwork(poke),
    baseHeightM: poke.height / 10,
    scaleSupported: pokemonSupportsScale(poke),
    scale: SCALE_DEFAULT,
    isCurrent: !!isCurrent,
  };
}

function openHeightModal() {
  if (!currentPokemon) return;
  heightCompare.entries = [ makePokemonEntry(currentPokemon, true) ];
  heightCompare.includeTrainer = true;
  document.getElementById('heightModalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderHeightModal();
}

function closeHeightModal() {
  document.getElementById('heightModalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function toggleTrainerCompare() {
  heightCompare.includeTrainer = !heightCompare.includeTrainer;
  renderHeightModal();
}

function syncTrainerEntryHeight() {
  // Called from the Settings tab slider — live-update the modal if it's open
  if (document.getElementById('heightModalOverlay')?.classList.contains('open')) {
    renderHeightModal();
  }
}

function updateTrainerHeightFromModal(totalInches) {
  totalInches = Math.max(36, Math.min(96, +totalInches || settings.trainerHeightIn));
  settings.trainerHeightIn = totalInches;
  renderHeightModal();
}

function updateTrainerHeightFromModalCm(cm) {
  const inches = (+cm || 0) / 2.54;
  updateTrainerHeightFromModal(inches);
}

function removeCompareEntry(uid) {
  heightCompare.entries = heightCompare.entries.filter(e => e.uid !== uid);
  renderHeightModal();
}

function updateEntryScale(uid, scaleVal) {
  const entry = heightCompare.entries.find(e => e.uid === uid);
  if (entry) entry.scale = +scaleVal;
  renderHeightModal();
}

async function addComparePokemon() {
  const input = document.getElementById('heightAddInput');
  const errEl = document.getElementById('heightAddError');
  const query = input.value.trim().toLowerCase();
  if (errEl) errEl.textContent = '';
  if (!query) return;

  try {
    const poke = await fetch(`${API}/pokemon/${query}`).then(r => {
      if (!r.ok) throw new Error('Not found');
      return r.json();
    });
    heightCompare.entries.push(makePokemonEntry(poke, false));
    input.value = '';
    renderHeightModal();
  } catch (e) {
    if (errEl) errEl.textContent = `✗ "${query}" not found.`;
  }
}

function buildPersonSilhouetteSVG(heightPx) {
  // Simple generic humanoid silhouette, viewBox 0 0 100 280 (aspect ~0.357)
  const w = Math.round(heightPx * (100/280));
  return `<svg class="height-silhouette-svg" viewBox="0 0 100 280" style="height:${heightPx}px;width:${w}px" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="28" r="24"/>
    <path d="M50 52
      C 28 52, 16 66, 14 92
      L 10 150 L 24 152 L 30 100
      L 33 100 L 28 200 L 44 200 L 50 130 L 56 200 L 72 200 L 67 100
      L 70 100 L 76 152 L 90 150 L 86 92
      C 84 66, 72 52, 50 52 Z"/>
    <rect x="38" y="195" width="11" height="78" rx="4"/>
    <rect x="51" y="195" width="11" height="78" rx="4"/>
  </svg>`;
}

function renderHeightModal() {
  const unit = settings.heightUnit;

  // Compute effective height (meters) for every visible entry
  const rows = heightCompare.entries.map(e => ({
    ...e,
    effHeightM: e.baseHeightM * (e.scaleSupported ? scaleMultiplier(e.scale) : 1),
  }));
  if (heightCompare.includeTrainer) {
    const trainerM = settings.trainerHeightIn * 0.0254;
    rows.push({ kind: 'trainer', uid: 'trainer', effHeightM: trainerM });
  }

  // ── Sidebar ──
  const trainerInches = settings.trainerHeightIn;
  const trainerFeet = Math.floor(trainerInches/12), trainerRemIn = trainerInches % 12;

  const compareCards = heightCompare.entries.map(e => {
    const heightLabel = formatHeight(e.baseHeightM * (e.scaleSupported ? scaleMultiplier(e.scale) : 1));
    const scaleBlock = e.scaleSupported
      ? `<div class="height-scale-row">
           <div class="height-scale-row-label">
             <span>Scale (1–255, SV size)</span>
             <span class="scale-badge" id="scaleVal-${e.uid}">${e.scale}</span>
           </div>
           <input type="range" class="height-scale-slider" min="1" max="255" step="1"
             value="${e.scale}"
             oninput="document.getElementById('scaleVal-${e.uid}').textContent=this.value"
             onchange="updateEntryScale('${e.uid}', this.value)"/>
         </div>`
      : `<div class="height-scale-unavailable">No size-scale data available for this Pokémon's games.</div>`;
    return `
      <div class="height-compare-card">
        <div class="height-compare-card-top">
          <img class="height-chip-sprite" src="${e.sprite}" alt="${e.name}"/>
          <span class="height-compare-card-name">${e.name}${e.isCurrent ? ' (current)' : ''}</span>
          <span class="height-compare-card-val">${heightLabel}</span>
          ${e.isCurrent ? '' : `<button class="height-remove-x" onclick="removeCompareEntry('${e.uid}')">×</button>`}
        </div>
        ${scaleBlock}
      </div>`;
  }).join('');

  document.getElementById('heightSidebar').innerHTML = `
    <div class="section-header">Compare To</div>
    <div class="height-trainer-toggle-row">
      <label>👤 Trainer</label>
      <button class="height-checkbox-btn ${heightCompare.includeTrainer ? 'on' : ''}" onclick="toggleTrainerCompare()"></button>
    </div>
    ${heightCompare.includeTrainer ? (unit === 'imperial' ? `
      <div class="height-trainer-input-row">
        <input type="number" min="1" max="8" value="${trainerFeet}"
          onchange="updateTrainerHeightFromModal((+this.value)*12 + ${trainerRemIn})"/>
        <span>ft</span>
        <input type="number" min="0" max="11" value="${trainerRemIn}"
          onchange="updateTrainerHeightFromModal(${trainerFeet*12} + (+this.value))"/>
        <span>in</span>
      </div>` : `
      <div class="height-trainer-input-row">
        <input type="number" min="90" max="245" value="${Math.round(trainerInches*2.54)}"
          onchange="updateTrainerHeightFromModalCm(this.value)"/>
        <span>cm</span>
      </div>`) : ''}

    <div class="section-header">Add Pokémon</div>
    <div class="height-add-row">
      <input type="text" id="heightAddInput" placeholder="Name or #..." autocomplete="off" autocapitalize="off"
        onkeydown="if(event.key==='Enter') addComparePokemon()"/>
      <button class="height-add-btn" onclick="addComparePokemon()">ADD</button>
    </div>
    <div class="height-add-error" id="heightAddError"></div>

    <div class="section-header">In Comparison</div>
    <div class="height-compare-list">${compareCards}</div>

    <div class="height-scale-note">
      Scale models the Scarlet/Violet individual size stat (1–255, 128 = average). Approximate, for visualization only.
    </div>
  `;

  // ── Chart ──
  if (rows.length === 0) {
    document.getElementById('heightChart').innerHTML = '<div class="height-empty-chart">Add a Pokémon or<br/>enable the trainer<br/>to compare heights.</div>';
    return;
  }

  const maxHeightM = Math.max(...rows.map(r => r.effHeightM), 0.1);
  let chartMaxM, majorStepM, minorStepM;
  if (unit === 'imperial') {
    const maxFeet = Math.max(1, Math.ceil(maxHeightM / 0.3048 * 1.15));
    chartMaxM = maxFeet * 0.3048;
    majorStepM = 0.3048;     // 1 ft
    minorStepM = 0.0254;     // 1 in
  } else {
    const headroom = maxHeightM * 1.15;
    majorStepM = headroom <= 3 ? 0.5 : 1;
    minorStepM = headroom <= 3 ? 0.1 : 0.2;
    chartMaxM = Math.max(majorStepM, Math.ceil(headroom / majorStepM) * majorStepM);
  }

  const CHART_PX = 300; // fixed pixel height of the track row (silhouettes area), sized for mobile
  const pxPerMeter = CHART_PX / chartMaxM;

  // Ruler ticks
  let ticksHtml = '';
  const tickCount = Math.round(chartMaxM / minorStepM);
  for (let i = 0; i <= tickCount; i++) {
    const m = i * minorStepM;
    if (m > chartMaxM + 1e-6) break;
    const isMajor = Math.abs((m / majorStepM) - Math.round(m / majorStepM)) < 1e-6;
    const bottomPx = m * pxPerMeter;
    ticksHtml += `<div class="height-ruler-tick ${isMajor?'major':''}" style="bottom:${bottomPx}px"></div>`;
    if (isMajor) {
      const label = unit === 'imperial' ? `${Math.round(m/0.3048)}'` : `${m.toFixed(m<1?1:0)}m`;
      ticksHtml += `<div class="height-ruler-label" style="bottom:${bottomPx}px">${label}</div>`;
    }
  }

  const slotsHtml = rows.map(r => {
    const px = Math.max(2, r.effHeightM * pxPerMeter);
    if (r.kind === 'trainer') {
      return `<div class="height-col-slot">${buildPersonSilhouetteSVG(px)}</div>`;
    }
    return `<div class="height-col-slot">
      <img class="height-silhouette ${r.isCurrent?'is-current':''}" src="${r.sprite}" alt="${r.name}" style="height:${px}px"/>
    </div>`;
  }).join('');

  const footersHtml = rows.map(r => {
    if (r.kind === 'trainer') {
      return `<div class="height-column">
        <div class="height-col-footer">
          <div class="height-col-icon">👤</div>
          <div class="height-col-name">Trainer</div>
          <div class="height-col-value">${formatHeight(r.effHeightM)}</div>
        </div>
      </div>`;
    }
    return `<div class="height-column">
      <div class="height-col-footer">
        <div class="height-col-icon">${r.isCurrent ? '⭐' : ''}</div>
        <div class="height-col-name">${r.name}</div>
        <div class="height-col-value">${formatHeight(r.effHeightM)}</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('heightChart').innerHTML = `
    <div class="height-track-row" style="height:${CHART_PX}px">
      <div class="height-ruler">${ticksHtml}</div>
      <div class="height-ground-line"></div>
      <div class="height-silhouettes-row">${slotsHtml}</div>
    </div>
    <div class="height-footer-row">${footersHtml}</div>
  `;
}

// ── CRY PLAYER ──
// Cries sourced from PokeAPI's raw sprite CDN and smogon/veekun mirrors
// Gen 1-5: .ogg from pokemondb; Gen 6+: mp3 from pokéapi GitHub sprites repo
const CRY_SOURCES = [
  { label: 'Latest',              gen: 'latest', url: id => `https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${id}.ogg` },
  { label: 'Gen I–V (Legacy OGG)',gen: 'legacy', url: id => `https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/legacy/${id}.ogg` },
];

let cryAudio = null;
let cryPlayingId = null;

function buildCryGenOptions(pokeId) {
  return CRY_SOURCES.map((s, i) =>
    `<option value="${i}">${s.label}</option>`
  ).join('');
}

function updateCryStatus() {
  const sel = document.getElementById('cryGenSelect');
  const status = document.getElementById('cryStatus');
  if (!sel || !status) return;
  const src = CRY_SOURCES[+sel.value];
  if (src) status.textContent = `Source: ${src.url(currentPokemon?.id || '…')}`;
}

function playCry(pokeId) {
  if (!pokeId) return;
  const sel = document.getElementById('cryGenSelect');
  const btn = document.getElementById('cryPlayBtn');
  const waveform = document.getElementById('cryWaveform');
  const status = document.getElementById('cryStatus');
  const srcIdx = sel ? +sel.value : 0;
  const src = CRY_SOURCES[srcIdx];
  if (!src) return;

  // Stop if already playing this cry
  if (cryAudio && !cryAudio.paused) {
    cryAudio.pause();
    cryAudio = null;
    if (btn) { btn.textContent = '▶ PLAY CRY'; btn.classList.remove('playing'); }
    if (waveform) waveform.classList.remove('active');
    return;
  }

  const url = src.url(pokeId);
  const audio = new Audio(url);
  cryAudio = audio;
  cryPlayingId = pokeId;

  if (btn) { btn.innerHTML = '■ STOP'; btn.classList.add('playing'); }
  if (waveform) waveform.classList.add('active');
  if (status) status.textContent = 'Playing…';

  audio.play().catch(err => {
    if (status) status.textContent = '✗ Could not load cry for this source/Pokémon.';
    if (btn) { btn.innerHTML = '▶ PLAY CRY'; btn.classList.remove('playing'); }
    if (waveform) waveform.classList.remove('active');
  });

  audio.onended = () => {
    if (btn) { btn.innerHTML = '▶ PLAY CRY'; btn.classList.remove('playing'); }
    if (waveform) waveform.classList.remove('active');
    if (status) status.textContent = '';
    cryAudio = null;
  };
}

// ── SETTINGS RENDER ──

  setContent(`

          <span class="settings-value-badge" id="fontSizeVal">${Math.round(settings.fontSize*100)}%</span>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-header">Units</div>

      <div class="settings-row">
        <div class="settings-label-group">

          <span class="settings-sublabel">Shown on the INFO tab</span>
        </div>
        <div class="settings-control">
          <div class="settings-toggle-group">
            <button class="settings-toggle-btn ${settings.heightUnit==='imperial'?'active':''}"
              id="unitImperial"
              onclick="settings.heightUnit='imperial'; document.getElementById('unitImperial').classList.add('active'); document.getElementById('unitMetric').classList.remove('active'); if(currentPokemon&&currentTab==='info')renderInfo()">
              ft / in
            </button>
            <button class="settings-toggle-btn ${settings.heightUnit==='metric'?'active':''}"
              id="unitMetric"
              onclick="settings.heightUnit='metric'; document.getElementById('unitMetric').classList.add('active'); document.getElementById('unitImperial').classList.remove('active'); if(currentPokemon&&currentTab==='info')renderInfo()">
              m
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-header">Height Comparison</div>

      <div class="settings-row">
        <div class="settings-label-group">

        </div>

            oninput="settings.trainerHeightIn=+this.value; document.getElementById('trainerHeightVal').textContent=formatFeetInches(this.value); syncTrainerEntryHeight()"/>
          <span class="settings-value-badge" id="trainerHeightVal">${formatFeetInches(settings.trainerHeightIn)}</span>
        </div>
      </div>
    </div>

    <div style="text-align:right;margin-top:8px">
      <button class="settings-reset-btn" onclick="settings={...SETTINGS_DEFAULTS}; applySettings(); renderSettings()">↺ Reset to Defaults</button>
    </div>
  `);
}

}

function showError(msg) {

      <p>NOT FOUND</p>

}

function setContent(html) {

}

document.addEventListener('keydown', e => {

    closeHeightModal();
  }
});

// Apply content screen font scale on init
